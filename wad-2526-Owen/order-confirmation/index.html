
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>KC - Order Confirmation</title>

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@300;400;500;600&display=swap"
          rel="stylesheet">

    <link rel="stylesheet"
          href="index.css">

</head>

<body>

    <div class="header">

        <div class="overlay">

            <img src="../assets/logo_full.png"
                 class="logo">

        </div>

    </div>

    <div class="content">

        <div class="receipt-card">

            <h1>ORDER CONFIRMATION</h1>

            <div id="cart"></div>

            <div class="divider"></div>

            <div class="total-row">

                <div id="total-qty">
                    0 Total
                </div>

                <div id="grand-total">
                    0
                </div>

            </div>

        </div>

        <div class="footer">

            <div>
                © Kongkow Cafe, 2025
            </div>

            <button class="finalize-btn">
                FINALIZE ORDER ✓
            </button>

        </div>

    </div>

    <script src="../db.js"></script>

    <script src="index.js"></script>

</body>

</html>
